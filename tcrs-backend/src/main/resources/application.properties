spring.application.name=tcrs-backend
server.port=${PORT:8080}

# Basic Auth 
spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}

#for spring security dependency you should set those above

# Force JVM timezone to IST so all dates are correct
# This fixes the wrong date/time issue everywhere including MongoDB audit fields
spring.jmx.enabled=false

# for mongodb atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT config (you'll set a real secret in Phase 2)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000




# ── Email (Gmail SMTP for forgot password OTP) ──────────────────────────────
# Steps to set this up:
# 1. Go to your Gmail account settings
# 2. Enable 2-Factor Authentication
# 3. Go to "App Passwords" → generate a password for "Mail"
# 4. Paste that 16-char password below as spring.mail.password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
 
# OTP expiry in minutes
otp.expiry.minutes=10
 
# App name shown in emails
app.name=TCRS


# Redis for caching
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
# spring.data.redis.timeout=2000ms  waiting time

spring.cache.type=redis

# Cache TTL (Time To Live) — how long data stays in Redis before refresh
# stats cache: 5 minutes, complaints: 3 minutes, officials: 10 minutes
spring.cache.redis.time-to-live=600000


# Jackson: serialize dates as ISO strings, not timestamps
#spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss